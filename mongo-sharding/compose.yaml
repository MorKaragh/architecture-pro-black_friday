services:
  # Config Server (для метаданных шардирования)
  mongodb-config:
    container_name: mongodb-config
    image: dh-mirror.gitverse.ru/mongo:latest
    command: mongod --configsvr --replSet configReplSet --bind_ip_all --port 27019
    volumes:
      - mongodb_config_data:/data/configdb
    networks:
      - mongo-sharding-network
    restart: always
    healthcheck:
      test: mongosh --host localhost:27019 --eval "db.adminCommand('ping')" --quiet
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Shard 1
  mongodb-shard1:
    container_name: mongodb-shard1
    image: dh-mirror.gitverse.ru/mongo:latest
    command: mongod --shardsvr --replSet shard1ReplSet --bind_ip_all --port 27018
    volumes:
      - mongodb_shard1_data:/data/db
    networks:
      - mongo-sharding-network
    restart: always

  # Shard 2
  mongodb-shard2:
    container_name: mongodb-shard2
    image: dh-mirror.gitverse.ru/mongo:latest
    command: mongod --shardsvr --replSet shard2ReplSet --bind_ip_all --port 27018
    volumes:
      - mongodb_shard2_data:/data/db
    networks:
      - mongo-sharding-network
    restart: always

  # Mongos Router (маршрутизатор запросов)
  mongos:
    container_name: mongos
    image: dh-mirror.gitverse.ru/mongo:latest
    command: mongos --configdb configReplSet/mongodb-config:27019 --bind_ip_all --port 27017
    depends_on:
      mongodb-config:
        condition: service_started
      mongodb-shard1:
        condition: service_started
      mongodb-shard2:
        condition: service_started
    ports:
      - "27017:27017"
    networks:
      - mongo-sharding-network
    restart: always

  # Инициализация шардирования
  mongo-init:
    container_name: mongo-init
    image: dh-mirror.gitverse.ru/mongo:latest
    depends_on:
      - mongodb-config
      - mongodb-shard1
      - mongodb-shard2
    volumes:
      - ./scripts/mongo-sharding-init.sh:/scripts/mongo-sharding-init.sh
    entrypoint: ["/bin/bash", "/scripts/mongo-sharding-init.sh"]
    networks:
      - mongo-sharding-network

  # Инициализация данных
  mongo-init-data:
    container_name: mongo-init-data
    image: dh-mirror.gitverse.ru/mongo:latest
    depends_on:
      - mongos
      - mongo-init
    volumes:
      - ./scripts/mongo-init-data.sh:/scripts/mongo-init-data.sh
    entrypoint: ["/bin/bash", "/scripts/mongo-init-data.sh"]
    networks:
      - mongo-sharding-network

  pymongo_api:
    container_name: pymongo_api
    build: 
      context: api_app
      dockerfile: Dockerfile
    depends_on:
      - mongos
      - mongo-init
      - mongo-init-data
    ports:
      - 8080:8080
    environment:
      MONGODB_URL: "mongodb://mongos:27017"
      MONGODB_DATABASE_NAME: "somedb"
    networks:
      - mongo-sharding-network
    restart: always

volumes:
  mongodb_config_data:
  mongodb_shard1_data:
  mongodb_shard2_data:

networks:
  mongo-sharding-network:
    driver: bridge
